name: monthly-momentum

on:
  schedule:
    - cron: "0 22 2-6 * *"   # 每月 2–6 號(UTC 22:00),喺首個交易日之後;結果只會喺新月份改變訊號日
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python momentum.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/momentum.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "Update momentum leaderboard" && git pull --rebase origin main && git push; fi
      - name: Rebuild site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml
